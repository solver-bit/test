<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif; background-color: #f5f5f7; color: #1d1d1f; margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        h2 { margin: 15px 0 20px 0; font-size: 20px; text-align: center; }
        .catalog { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .product-card {
            background-color: #ffffff; border-radius: 12px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5ea;
        }
        .product-title { font-weight: bold; font-size: 15px; }
        .product-price { color: #0071e3; font-weight: bold; margin-top: 5px; }
        .btn-select {
            background-color: #0071e3; color: #ffffff; border: none; border-radius: 8px;
            padding: 8px 16px; font-weight: bold; cursor: pointer;
        }
        .form-container {
            width: 100%; max-width: 400px; background-color: #ffffff; border-radius: 12px;
            padding: 15px; margin-top: 20px; box-sizing: border-box; border: 1px solid #e5e5ea;
            display: flex; flex-direction: column; gap: 10px;
        }
        input {
            width: 100%; background-color: #f5f5f7; color: #1d1d1f; border: 1px solid #d2d2d7;
            border-radius: 8px; padding: 10px; font-size: 14px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Каталог товаров</h2>

    <div class="catalog">
        <div class="product-card">
            <div>
                <div class="product-title">Комплект оптики (Тип А)</div>
                <div class="product-price">1200 BYN</div>
            </div>
            <button class="btn-select" id="btn1" onclick="selectItem('btn1', 'Тип А', 1200)">Выбрать</button>
        </div>

        <div class="product-card">
            <div>
                <div class="product-title">Комплект оптики (Тип Б)</div>
                <div class="product-price">850 BYN</div>
            </div>
            <button class="btn-select" id="btn2" onclick="selectItem('btn2', 'Тип Б', 850)">Выбрать</button>
        </div>

        <div class="product-card">
            <div>
                <div class="product-title">Модуль доп. тюнинга</div>
                <div class="product-price">450 BYN</div>
            </div>
            <button class="btn-select" id="btn3" onclick="selectItem('btn3', 'Тюнинг-модуль', 450)">Выбрать</button>
        </div>
    </div>

    <div class="form-container">
        <input type="text" id="user_fio" placeholder="Ваши ФИО и Город через пробел" oninput="checkData()">
        <input type="text" id="user_phone" placeholder="Контактный телефон (+375...)" oninput="checkData()">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let chosenItems = [];

        function selectItem(btnId, name, price) {
            const btn = document.getElementById(btnId);
            const index = chosenItems.findIndex(i => i.name === name);

            if (index === -1) {
                // Если товар не был выбран — выбираем его
                chosenItems.push({ name: name, price: price });
                btn.textContent = "Убрать";
                btn.style.backgroundColor = "#ff3b30"; // Меняем на красный цвет
            } else {
                // Если товар уже в корзине — убираем его
                chosenItems.splice(index, 1);
                btn.textContent = "Выбрать";
                btn.style.backgroundColor = "#0071e3"; // Возвращаем синий цвет
            }
            checkData();
        }

        function checkData() {
            const fio = document.getElementById("user_fio").value.trim();
            const phone = document.getElementById("user_phone").value.trim();

            // Включаем нижнюю кнопку ТГ, только если выбран товар и заполнены поля
            if (chosenItems.length > 0 && fio.length > 4 && phone.length > 8) {
                let totalSum = chosenItems.reduce((sum, item) => sum + item.price, 0);
                tg.MainButton.text = `ОФОРМИТЬ ЗАКАЗ (${totalSum} BYN)`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.onEvent('mainButtonClicked', function() {
            const fio = document.getElementById("user_fio").value.trim();
            const phone = document.getElementById("user_phone").value.trim();
            let goodsList = chosenItems.map(i => i.name).join(' + ');

            // Отправляем сквозную строку обратно в Python-код бота
            tg.sendData(`${goodsList}|||${fio}|||${phone}`);
            tg.close();
        });
    </script>
</body>
</html>
